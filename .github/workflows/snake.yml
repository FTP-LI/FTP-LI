name: Generate contribution snake

on:
  schedule:
    # Runs every day at 00:17 in Asia/Shanghai (UTC+8).
    - cron: "17 16 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate light and dark SVG animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#2E8B57&color_dots=#ebedf0,#c6e8d2,#8fd0a5,#58b77a,#2E8B57
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#56d38b&color_dots=#161b22,#0e4429,#00682f,#26a641,#39d353
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish animations to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
